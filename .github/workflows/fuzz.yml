name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - src/scanner.c
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - src/scanner.c
      - .github/workflows/fuzz.yml

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/fuzz-action@v4
